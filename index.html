<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f4f6ff;
            text-align: center;
        }

        .result h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .prediction {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .confidence {
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Prediction App</h1>
    <p class="subtitle">Enter your data to get a prediction</p>

    <label for="input1">Value 1</label>
    <input type="number" id="input1" placeholder="Enter value">

    <label for="input2">Value 2</label>
    <input type="number" id="input2" placeholder="Enter value">

    <label for="input3">Value 3</label>
    <input type="number" id="input3" placeholder="Enter value">

    <button onclick="makePrediction()">Predict</button>

    <div class="result" id="result">
        <h2>Prediction Result</h2>
        <div class="prediction" id="prediction"></div>
        <div class="confidence" id="confidence"></div>
    </div>

</div>

<script>
    function makePrediction() {

        const value1 = Number(document.getElementById("input1").value);
        const value2 = Number(document.getElementById("input2").value);
        const value3 = Number(document.getElementById("input3").value);

        if (isNaN(value1) || isNaN(value2) || isNaN(value3)) {
            alert("Please enter all three values.");
            return;
        }

        // Simple prediction logic
        const average = (value1 + value2 + value3) / 3;

        let prediction;
        let confidence;

        if (average >= 70) {
            prediction = "High";
            confidence = Math.min(95, 70 + average / 10);
        } 
        else if (average >= 40) {
            prediction = "Medium";
            confidence = 75;
        } 
        else {
            prediction = "Low";
            confidence = Math.min(90, 60 + (40 - average));
        }

        document.getElementById("prediction").textContent = prediction;
        document.getElementById("confidence").textContent =
            "Confidence: " + confidence.toFixed(1) + "%";

        document.getElementById("result").style.display = "block";
    }
</script>

</body>
</html>
